# Netlify Free is credit-based with a monthly allowance that does not roll
# over. Production deploys consume credits.
#
# Develop on a branch and minimise production deploys. Branch/preview deploys
# may or may not consume credits depending on current terms — verify against
# your account's usage page before relying on them being free.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
