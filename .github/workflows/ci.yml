# Cellar Atlas V3 — quality gate
#
# Runs the same checks a developer runs before committing, on every pull
# request and every push to main.
#
# ── WHAT IT DELIBERATELY DOES NOT DO ─────────────────────────────────────
# No Supabase credentials, no database connection, no live Playwright E2E,
# and no deployment. The only Playwright project it runs is `harness`, which
# reads source files and starts no browser against any server, so it cannot
# touch the production or E2E cellars.
#
# Permissions are read-only: this workflow never writes to the repository.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the project is developed against.
          node-version: "22"
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies and fails
      # if the lockfile is out of step with package.json.
      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      # Playwright needs its browser binaries only for the harness project's
      # runner; no browser is actually launched against a site.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Build first because architecture tests inspect dist/.
      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Harness tests
        run: npx playwright test --project=harness --reporter=list
